<!DOCTYPE html>
<html>
<head>
    <title>Yoshi-Style Pilot Sim v0.7</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #111; color: white; font-family: sans-serif; touch-action: none; user-select: none; }
        .btn { padding: 10px 15px; background: #444; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .active { background: #0077ff; }
        #menu { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 100; }
        .slider-box { position: absolute; display: flex; flex-direction: column; align-items: center; width: 70px; z-index: 50; }
        input[type=range].v-slider { writing-mode: bt-lr; appearance: slider-vertical; width: 50px; height: 160px; }
        #ui-m1 { top: 15%; left: 5%; } #ui-m2 { top: 15%; right: 5%; }
        #ui-m3 { bottom: 10%; left: 5%; } #ui-m4 { bottom: 10%; right: 5%; }
        #ui-all { top: 55%; left: 50%; transform: translate(-50%, -50%); }
        #hud { position: absolute; top: 10px; left: 10px; font-family: monospace; font-size: 12px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="menu">
        <button id="view-btn" class="btn">VIEW: TPV</button>
        <button id="mode-btn" class="btn">MODE: RAW</button>
        <button id="assist-btn" class="btn">YAW ASSIST: OFF</button>
        <button id="reset-btn" class="btn" style="background: #f44;">RESET</button>
    </div>
    <div id="hud">ALT: 0.0m | YAW: 0.0°</div>
    
    <div id="ui-m1" class="slider-box"><input type="range" class="v-slider" id="m1" min="0" max="100" value="0"><div class="label">M1(左前)</div></div>
    <div id="ui-m2" class="slider-box"><input type="range" class="v-slider" id="m2" min="0" max="100" value="0"><div class="label">M2(右前)</div></div>
    <div id="ui-m3" class="slider-box"><input type="range" class="v-slider" id="m3" min="0" max="100" value="0"><div class="label">M3(左後)</div></div>
    <div id="ui-m4" class="slider-box"><input type="range" class="v-slider" id="m4" min="0" max="100" value="0"><div class="label">M4(右後)</div></div>
    <div id="ui-all" class="slider-box"><input type="range" class="v-slider" id="all" min="0" max="100" value="0" style="accent-color:red;"><div class="label" style="color:red">ALL</div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        let isFPV = false, isYawAssist = false;
        let mode = 'RAW'; // RAW, LEVEL

        scene.add(new THREE.GridHelper(2000, 1000, 0x884444, 0x882222));
        scene.add(new THREE.AmbientLight(0x909090));
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(10, 20, 10); scene.add(sun);

        const drone = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 1.2), new THREE.MeshPhongMaterial({color: 0x333333}));
        drone.add(body);
        const nose = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.15, 0.2), new THREE.MeshPhongMaterial({color: 0xff0000}));
        nose.position.z = -0.5; drone.add(nose);
        
        const motorPos = [[0.6, 0, -0.6], [-0.6, 0, -0.6], [0.6, 0, 0.6], [-0.6, 0, 0.6]];
        motorPos.forEach(p => {
            const m = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.05, 16), new THREE.MeshPhongMaterial({color: 0x00ff00, transparent: true, opacity: 0.5}));
            m.position.set(...p); drone.add(m);
        });
        scene.add(drone);

        let vel = new THREE.Vector3(), angVel = new THREE.Vector3();
        const sliders = ['m1', 'm2', 'm3', 'm4'].map(id => document.getElementById(id));
        const allSlider = document.getElementById('all');

        // UIイベント
        allSlider.oninput = (e) => sliders.forEach(s => s.value = e.target.value);
        document.getElementById('view-btn').onclick = function() { isFPV = !isFPV; this.innerHTML = `VIEW: ${isFPV?'FPV':'TPV'}`; };
        document.getElementById('assist-btn').onclick = function() { isYawAssist = !isYawAssist; this.classList.toggle('active'); this.innerHTML = `YAW ASSIST: ${isYawAssist?'ON':'OFF'}`; };
        document.getElementById('mode-btn').onclick = function() { mode = (mode === 'RAW' ? 'LEVEL' : 'RAW'); this.innerHTML = `MODE: ${mode}`; };
        document.getElementById('reset-btn').onclick = reset;

        function reset() {
            drone.position.set(0, 0.2, 0); drone.rotation.set(0, 0, 0);
            vel.set(0,0,0); angVel.set(0,0,0);
            allSlider.value = 0; sliders.forEach(s => s.value = 0);
        }

        function animate() {
            requestAnimationFrame(animate);
            const gravity = -0.006, powerScale = 0.00018, damp = 0.96;

            sliders.forEach((s, i) => {
                let lift = parseFloat(s.value) * powerScale;
                
                // LEVELモード（角度制御）：簡易的な水平復元力を加える
                if (mode === 'LEVEL') {
                    const roll = drone.rotation.z, pitch = drone.rotation.x;
                    // 傾きに応じて反対側のモーター出力を自動調整（簡易版）
                    if (i === 0 || i === 2) lift += roll * 0.002;
                    if (i === 1 || i === 3) lift -= roll * 0.002;
                }

                const force = new THREE.Vector3(0, lift, 0).applyQuaternion(drone.quaternion);
                vel.add(force);
                const p = motorPos[i];
                angVel.x -= p[2] * lift * 2.0; 
                angVel.z -= p[0] * lift * 2.0;

                // ヨー（反トルク）
                let yawTorque = (i === 0 || i === 3) ? -lift : lift;
                angVel.y += yawTorque * 1.5;
            });

            // ヨー・アシスト：回転を検知して打ち消す力を自動投入
            if (isYawAssist) {
                angVel.y *= 0.5; // 回転慣性を無理やり抑え込む
            }

            vel.y += gravity;
            drone.position.add(vel);
            drone.rotation.x += angVel.x;
            drone.rotation.y += angVel.y;
            drone.rotation.z += angVel.z;
            vel.multiplyScalar(damp); angVel.multiplyScalar(0.9);

            if (drone.position.y < 0.05) { drone.position.y = 0.05; vel.set(0,0,0); angVel.set(0,0,0); }

            if (isFPV) {
                const fpvOffset = new THREE.Vector3(0, 0.2, -0.4).applyQuaternion(drone.quaternion);
                camera.position.copy(drone.position).add(fpvOffset);
                camera.quaternion.copy(drone.quaternion);
            } else {
                camera.position.set(drone.position.x, drone.position.y + 6, drone.position.z + 10);
                camera.lookAt(drone.position);
            }

            document.getElementById('hud').innerHTML = `ALT: ${drone.position.y.toFixed(1)}m | YAW: ${(drone.rotation.y * 180 / Math.PI).toFixed(0)}°`;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
